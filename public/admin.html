<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · ETFmapa.cz</title>
<style>
  :root { --ink:#12233d; --muted:#6b778c; --line:#e4ded4; --bg:#f6f3ee; --green:#0f7b5f; --red:#b4372f; --a:#2a6fdb; --b:#d98a00; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-variant-numeric:tabular-nums; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:18px; }
  h1 { font-size:20px; margin:0; } h2 { font-size:16px; margin:28px 0 10px; }
  .muted { color:var(--muted); }
  select, input, button { font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  button { cursor:pointer; font-weight:600; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.danger { color:var(--red); padding:4px 8px; font-weight:500; }
  .login { max-width:340px; margin:15vh auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px; }
  .login input { width:100%; margin:10px 0; }
  .login button { width:100%; }
  .err { color:var(--red); font-weight:600; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .kpi .l { font-size:12px; color:var(--muted); }
  .kpi .v { font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .kpi .s { font-size:12px; color:var(--muted); }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px; color:#fff; }
  .tag.a { background:var(--a); } .tag.b { background:var(--b); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { font-size:12px; color:var(--muted); font-weight:600; background:#fbfaf8; position:sticky; top:0; }
  td.num, th.num { text-align:right; }
  .bar { height:6px; background:#eef0f3; border-radius:3px; margin-top:4px; min-width:80px; }
  .bar i { display:block; height:100%; border-radius:3px; }
  .bar.a i { background:var(--a); } .bar.b i { background:var(--b); }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .tools input { flex:1; min-width:200px; }
  .empty { padding:24px; text-align:center; color:var(--muted); }
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <h1>Admin ETFmapa.cz</h1>
  <form id="loginForm">
    <input type="password" id="pw" placeholder="Heslo" autocomplete="current-password" required>
    <button class="primary">Přihlásit</button>
    <p class="err" id="loginErr" hidden></p>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div><h1>Leady a funnel</h1><span class="muted" id="updated"></span></div>
    <div>
      <select id="days">
        <option value="1">Dnes</option>
        <option value="7">7 dní</option>
        <option value="30" selected>30 dní</option>
        <option value="90">90 dní</option>
      </select>
      <button id="refresh">Obnovit</button>
      <button id="logout">Odhlásit</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <h2>Funnel podle varianty reklamy <span class="muted">(unikátní návštěvy, které krok udělaly)</span></h2>
  <div class="card"><table id="funnel"></table></div>

  <h2>Po dnech</h2>
  <div class="card" style="max-height:320px"><table id="daily"></table></div>

  <h2>Leady <span class="muted" id="leadCount"></span></h2>
  <div class="tools">
    <input id="q" placeholder="Hledat e-mail, zdroj, kampaň…">
    <button id="csv">Stáhnout CSV</button>
  </div>
  <div class="card" style="max-height:600px"><table id="leads"></table></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pw = sessionStorage.getItem('admin_pw');
  var data = null;

  var STEPS = [
    ['lp_view', 'Vstup na stránku'],
    ['hero_cta', 'Klik na hlavní CTA'],
    ['section_view:table', 'Viděl srovnání'],
    ['section_view:calc', 'Viděl kalkulačku'],
    ['calc_interact', 'Použil kalkulačku'],
    ['unlock_click', 'Klik „Odemknout“'],
    ['calc_cta', 'CTA pod kalkulačkou'],
    ['sticky_cta', 'Sticky CTA'],
    ['section_view:form', 'Viděl formulář'],
    ['form_focus', 'Klikl do pole e-mail'],
    ['form_submit', 'Odeslal formulář'],
    ['form_error', 'Chyba ve formuláři'],
    ['lead_success', 'Lead uložen ✓'],
    ['lead_fail', 'Lead selhal (server)']
  ];

  var nf = new Intl.NumberFormat('cs-CZ');
  var pct = function (a, b) { return b ? (a / b * 100).toLocaleString('cs-CZ', { maximumFractionDigits: 1 }) + ' %' : '–'; };
  var dt = function (iso) { return new Date(iso).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }); };

  // Bezpečné vytváření DOM (e-maily jsou uživatelský vstup → nikdy innerHTML).
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k]; else if (k === 'onclick') e.onclick = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function fill(table, head, rows) {
    table.textContent = '';
    table.appendChild(el('thead', {}, [el('tr', {}, head.map(function (h) { return el('th', { text: h[0], class: h[1] || '' }); }))]));
    var tb = el('tbody', {}, rows);
    if (!rows.length) tb.appendChild(el('tr', {}, [el('td', { colspan: head.length, class: 'empty', text: 'Zatím žádná data' })]));
    table.appendChild(tb);
  }

  function api(method, qs) {
    return fetch('/api/admin' + qs, { method: method, headers: { Authorization: 'Bearer ' + pw } }).then(function (r) {
      if (r.status === 401) { logout('Špatné heslo'); throw new Error('401'); }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }

  function load() {
    api('GET', '?days=' + $('days').value).then(function (j) {
      data = j;
      render();
      $('updated').textContent = 'Aktualizováno ' + new Date().toLocaleTimeString('cs-CZ');
    }).catch(function (e) {
      if (String(e).indexOf('401') < 0) $('updated').textContent = 'Chyba: ' + e.message;
    });
  }

  function totals() {
    var t = { a: {}, b: {} };
    data.daily.forEach(function (d) {
      Object.keys(d.counts).forEach(function (k) {
        var parts = k.split('|');
        t[parts[0]][parts[1]] = (t[parts[0]][parts[1]] || 0) + d.counts[k];
      });
    });
    return t;
  }

  function render() {
    var t = totals();
    var since = new Date(Date.now() - ($('days').value - 1) * 864e5).toISOString().slice(0, 10);
    var leadsInRange = data.leads.filter(function (l) { return l.created_at.slice(0, 10) >= since; });
    var visits = (t.a.lp_view || 0) + (t.b.lp_view || 0);

    // KPI
    var k = $('kpis'); k.textContent = '';
    function kpi(label, value, sub) { k.appendChild(el('div', { class: 'kpi' }, [el('div', { class: 'l', text: label }), el('div', { class: 'v', text: value }), el('div', { class: 's', text: sub || '' })])); }
    kpi('Návštěvy', nf.format(visits), 'A ' + nf.format(t.a.lp_view || 0) + ' · B ' + nf.format(t.b.lp_view || 0));
    kpi('Leady', nf.format(leadsInRange.length), 'uloženo v databázi');
    kpi('Konverze celkem', pct(leadsInRange.length, visits), 'leady / návštěvy');
    kpi('Konverze A', pct(t.a.lead_success || 0, t.a.lp_view || 0), nf.format(t.a.lead_success || 0) + ' leadů');
    kpi('Konverze B', pct(t.b.lead_success || 0, t.b.lp_view || 0), nf.format(t.b.lead_success || 0) + ' leadů');

    // Funnel
    var max = Math.max(t.a.lp_view || 0, t.b.lp_view || 0, 1);
    function cell(v, base, cls) {
      var n = t[v][base] || 0;
      return el('td', { class: 'num' }, [nf.format(n) + '  ', el('span', { class: 'muted', text: pct(n, t[v].lp_view || 0) }),
        el('div', { class: 'bar ' + cls }, [el('i', { style: 'width:' + (n / max * 100) + '%' })])]);
    }
    fill($('funnel'), [['Krok'], ['Varianta A', 'num'], ['Varianta B', 'num']], STEPS.map(function (s) {
      return el('tr', {}, [el('td', { text: s[1] }), cell('a', s[0], 'a'), cell('b', s[0], 'b')]);
    }));

    // Po dnech
    fill($('daily'), [['Den'], ['Návštěvy A', 'num'], ['Leady A', 'num'], ['Návštěvy B', 'num'], ['Leady B', 'num'], ['Konverze', 'num']],
      data.daily.filter(function (d) { return Object.keys(d.counts).length; }).map(function (d) {
        var c = function (k) { return d.counts[k] || 0; };
        var v = c('a|lp_view') + c('b|lp_view'), l = c('a|lead_success') + c('b|lead_success');
        return el('tr', {}, [el('td', { text: new Date(d.date + 'T12:00:00').toLocaleDateString('cs-CZ') }),
          el('td', { class: 'num', text: nf.format(c('a|lp_view')) }), el('td', { class: 'num', text: nf.format(c('a|lead_success')) }),
          el('td', { class: 'num', text: nf.format(c('b|lp_view')) }), el('td', { class: 'num', text: nf.format(c('b|lead_success')) }),
          el('td', { class: 'num', text: pct(l, v) })]);
      }));

    renderLeads(leadsInRange);
  }

  function filtered(list) {
    var q = $('q').value.trim().toLowerCase();
    if (!q) return list;
    return list.filter(function (l) { return JSON.stringify([l.email, l.utm, l.variant]).toLowerCase().indexOf(q) >= 0; });
  }
  function calcText(c) { return c ? nf.format(c.monthly) + ' Kč × ' + c.years + ' let, fond ' + c.fee + ' %' : '–'; }

  function renderLeads(list) {
    var rows = filtered(list);
    $('leadCount').textContent = '(' + rows.length + ')';
    fill($('leads'), [['Datum'], ['E-mail'], ['Var.'], ['Zdroj / kampaň'], ['Výpočet'], ['Čas do leadu', 'num'], ['']], rows.map(function (l) {
      var u = l.utm || {};
      return el('tr', {}, [
        el('td', { text: dt(l.created_at) }),
        el('td', {}, [el('b', { text: l.email })]),
        el('td', {}, [el('span', { class: 'tag ' + (l.variant === 'b' ? 'b' : 'a'), text: (l.variant || 'a').toUpperCase() })]),
        el('td', { text: [u.utm_source, u.utm_campaign].filter(Boolean).join(' / ') || 'přímo' }),
        el('td', { text: calcText(l.calc) }),
        el('td', { class: 'num', text: l.time_to_lead_ms ? Math.round(l.time_to_lead_ms / 1000) + ' s' : '–' }),
        el('td', {}, [el('button', { class: 'danger', text: 'Smazat', title: 'Výmaz na žádost (GDPR)', onclick: function () { del(l); } })])
      ]);
    }));
  }

  function del(l) {
    if (!confirm('Trvale smazat lead ' + l.email + '?')) return;
    api('DELETE', '?id=' + encodeURIComponent(l.id)).then(load).catch(function (e) { alert('Nepodařilo se smazat: ' + e.message); });
  }

  function csv() {
    var since = new Date(Date.now() - ($('days').value - 1) * 864e5).toISOString().slice(0, 10);
    var rows = filtered(data.leads.filter(function (l) { return l.created_at.slice(0, 10) >= since; }));
    var q = function (v) { v = v == null ? '' : String(v); return /[";,\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [['created_at', 'email', 'variant', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'monthly', 'years', 'fee', 'time_to_lead_s'].join(';')];
    rows.forEach(function (l) {
      var u = l.utm || {}, c = l.calc || {};
      lines.push([l.created_at, l.email, l.variant, u.utm_source, u.utm_medium, u.utm_campaign, u.utm_content, c.monthly, c.years, c.fee,
        l.time_to_lead_ms ? Math.round(l.time_to_lead_ms / 1000) : ''].map(q).join(';'));
    });
    var blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = el('a', { href: URL.createObjectURL(blob), download: 'leady-' + new Date().toISOString().slice(0, 10) + '.csv' });
    document.body.appendChild(a); a.click(); a.remove();
  }

  function logout(msg) {
    sessionStorage.removeItem('admin_pw'); pw = null;
    $('app').hidden = true; $('login').hidden = false;
    if (msg) { $('loginErr').textContent = msg; $('loginErr').hidden = false; }
  }
  function start() { $('login').hidden = true; $('app').hidden = false; load(); }

  $('loginForm').onsubmit = function (e) {
    e.preventDefault(); pw = $('pw').value; sessionStorage.setItem('admin_pw', pw); $('loginErr').hidden = true; start();
  };
  $('days').onchange = load;
  $('refresh').onclick = load;
  $('logout').onclick = function () { logout(); };
  $('q').oninput = function () { if (data) render(); };
  $('csv').onclick = function () { if (data) csv(); };

  if (pw) start(); else $('login').hidden = false;
})();
</script>
</body>
</html>
